# REDUE Performance — include this server{} block on nginx hosts
# (Apache / LiteSpeed should use the root .htaccess instead).
#
#   include /path/to/nginx.performance.conf;
#
# Does not replace WordPress try_files / permalink routing.

# Images + fonts: 1 year, immutable
location ~* \.(jpe?g|png|webp|svg|gif|ico|woff2|woff|ttf|otf)$ {
	expires 1y;
	add_header Cache-Control "public, max-age=31536000, immutable";
	access_log off;
}

# CSS / JS: 1 month (HTML still uses ?v=filemtime for busting)
location ~* \.(css|js)$ {
	expires 1M;
	add_header Cache-Control "public, max-age=2592000";
	access_log off;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types
	text/plain
	text/css
	text/javascript
	text/xml
	application/javascript
	application/json
	application/ld+json
	application/xml
	application/xhtml+xml
	image/svg+xml;
